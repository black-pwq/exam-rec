name: exam-rec

services:
  app:
    image: ${EXAM_REC_IMAGE:-exam-rec:local-cpu}
    platform: linux/amd64
    build:
      context: .
      args:
        PADDLE_GROUP: paddle-cpu
        VCS_REF: ${EXAM_REC_VCS_REF:-unknown}
    env_file:
      - ./deploy/.env.production
    environment:
      EXAM_REC_JOB_ROOT: /data/jobs
      EXAM_REC_RUNTIME: cpu
      PADDLE_PDX_CACHE_HOME: /data/models
    volumes:
      - jobs:/data/jobs
      - models:/data/models
    ports:
      - "${EXAM_REC_BIND_IP:-127.0.0.1}:${EXAM_REC_PORT:-8080}:8000"
    init: true
    restart: unless-stopped
    stop_grace_period: 10m
    healthcheck:
      test: ["CMD", "python", "-m", "deploy.healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  jobs:
  models:
