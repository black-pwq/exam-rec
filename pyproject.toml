[project]
name = "exam-rec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"opencv-python-headless>=4.10,<5",
	"openai>=2,<3",
	"paddlepaddle==3.2.0",
	"pymupdf>=1.24,<2",
	"paddleocr[all]>=3.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu" }

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "ignore:No ccache found\\..*:UserWarning",
]
markers = [
    "integration: runs PaddleOCR with local model files",
]
