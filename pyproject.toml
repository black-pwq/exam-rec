[project]
name = "exam-rec"
version = "0.1.0"
description = "FastAPI service for OCR-based exam question recognition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"opencv-python-headless>=4.10,<5",
	"openai>=2,<3",
	"pymupdf>=1.24,<2",
	"paddleocr[all]>=3.7.0",
	"fastapi>=0.115,<1",
	"uvicorn>=0.34,<1",
	"python-multipart>=0.0.20,<1",
	"python-dotenv>=1.1,<2",
	"requests>=2.32,<3",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9,<10",
]
paddle-cpu = [
    "paddlepaddle==3.2.0",
]
paddle-cu118 = [
    "paddlepaddle-gpu==3.2.0",
]

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu" }
paddlepaddle-gpu = { index = "paddle-cu118" }

[tool.uv]
package = true
default-groups = ["dev", "paddle-cpu"]
conflicts = [
    [
        { group = "paddle-cpu" },
        { group = "paddle-cu118" },
    ],
]

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[[tool.uv.index]]
name = "paddle-cu118"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu118/"
explicit = true

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = [
    "ignore:No ccache found\\..*:UserWarning",
]
